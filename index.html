<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Rewards UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

        :root {
            --bg-deep: #0f172a;
            --bg-light: #1e293b;
            --success: #22c55e;
            --gold: #fbbf24;
            --gold-glow: #f59e0b;
            --locked: #94a3b8;
            --locked-bg: #475569;
            --neon-blue: #22d3ee;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--white);
        }

        /* Container Principal */
        .reward-container {
            width: 100%;
            max-width: 800px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Titre */
        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            margin: 0 0 1.5rem 0;
            text-shadow: 3px 3px 0px #000;
            font-style: italic;
            letter-spacing: -1px;
            -webkit-text-stroke: 1px black; /* Contour noir style cartoon */
        }

        /* --- Barre de Progression (Haut) --- */
        .progress-track {
            display: flex;
            gap: 5px;
            margin-bottom: 2rem;
            padding: 0 10px;
        }

        .track-segment {
            flex: 1;
            height: 40px;
            background: var(--locked-bg);
            transform: skewX(-20deg); /* Forme inclinée */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            border: 2px solid rgba(0,0,0,0.2);
            position: relative;
        }

        .track-segment.completed {
            background: var(--success);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
        }

        .track-segment.active {
            background: var(--gold);
            box-shadow: 0 0 15px var(--gold-glow);
            border-color: #fff;
            transform: skewX(-20deg) scale(1.05);
            z-index: 2;
        }

        .track-segment svg {
            transform: skewX(20deg); /* Redresser l'icône */
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* --- Grille des Cartes (Bas) --- */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 2rem;
        }

        .day-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .day-label {
            font-size: 0.8rem;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 700;
            text-transform: uppercase;
        }

        .reward-box {
            width: 100%;
            aspect-ratio: 1;
            background: #334155;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid transparent;
            transition: transform 0.2s;
            position: relative;
        }

        .reward-box svg {
            width: 50%;
            height: 50%;
            fill: white;
        }

        /* Styles spécifiques aux états */
        .day-card.completed .reward-box {
            background: rgba(34, 197, 94, 0.2);
            border-color: var(--success);
        }
        .day-card.completed .circle-icon {
            background: var(--success);
            border-radius: 50%;
            padding: 10px;
            box-shadow: 0 4px 0 #15803d; /* Effet 3D bouton */
        }

        .day-card.active .day-label {
            color: var(--gold);
        }
        .day-card.active .reward-box {
            background: rgba(251, 191, 36, 0.15);
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            animation: pulse 2s infinite;
        }
        .day-card.active .coin-icon {
            fill: var(--gold);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            width: 60%;
            height: 60%;
        }

        .day-card.locked .reward-box {
            background: #1e293b;
            border-color: #475569;
        }
        .day-card.locked svg {
            fill: #64748b;
        }

        /* --- Bouton Claim --- */
        .claim-btn-container {
            display: flex;
            justify-content: flex-end;
        }

        .claim-btn {
            background: transparent;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 15px 60px;
            border: 3px solid var(--neon-blue);
            border-radius: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3), inset 0 0 15px rgba(34, 211, 238, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .claim-btn:hover {
            background: var(--neon-blue);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.6);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            transform: translateY(-2px);
        }

        .claim-btn:active {
            transform: translateY(1px);
        }

        /* Animations */
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); }
            50% { box-shadow: 0 0 25px rgba(251, 191, 36, 0.6); }
            100% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); }
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .days-grid {
                grid-template-columns: repeat(4, 1fr); /* 2 lignes sur mobile */
            }
            .day-card:nth-child(n+5) {
                grid-column: span 1; /* Suite sur la ligne suivante */
            }
            h1 { font-size: 2rem; }
            .claim-btn { width: 100%; }
        }
    </style>
</head>
<body>

<script>
    function claimReward() {
        const btn = document.querySelector('.claim-btn');
        const currentDay = document.getElementById('currentDay');

        // Animation simple de feedback
        btn.innerHTML = "Claimed!";
        btn.style.background = "#22d3ee";
        btn.style.color = "#000";

        // Changer le jour 4 en vert (simulé)
        currentDay.classList.remove('active');
        currentDay.classList.add('completed');

        const box = currentDay.querySelector('.reward-box');
        box.innerHTML = '<div class="circle-icon"><svg viewBox="0 0 24 24" style="fill:white; width:100%; height:100%"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>';

        alert("Récompense récupérée !");
    }
</script>
