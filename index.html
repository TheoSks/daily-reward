<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Welcome Offer - Ultimate Fix</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-space: radial-gradient(circle at center, #1e3a8a 0%, #020617 100%);
    --neon-blue: #2563eb;
    --neon-blue-light: #60a5fa;
    
    /* Couleurs des Jours */
    --green-light: #4ade80;
    --green-dark: #15803d;
    --gold-light: #fde047;
    --gold-dark: #b45309;
    --grey-light: #94a3b8;
    --grey-dark: #475569;
  }

  body {
    margin: 0;
    padding: 20px;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
  }

  /* --- LE CONTENEUR --- */
  .banner-container {
    position: relative;
    width: 900px;
    height: 380px;
    /* Fond Espace Profond */
    background: 
        radial-gradient(circle at 30% 20%, rgba(37, 99, 235, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 70% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 40%),
        #020617; /* Noir bleuté */
    border-radius: 20px;
    overflow: hidden; /* Important pour que rien ne dépasse */
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
    box-sizing: border-box;
    /* Bordure subtile */
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* --- TITRE --- */
  .title-wrapper {
    position: relative;
    margin-bottom: 25px;
    z-index: 10;
  }
  
  .title {
    font-family: 'Titan One', cursive; /* Police Cartoon */
    font-size: 60px;
    text-transform: uppercase;
    color: white;
    
    /* Effet de texte blanc avec contour doré */
    -webkit-text-stroke: 4px #b45309; /* Contour foncé */
    text-shadow: 
        0 2px 0 #ccc, 
        0 4px 5px rgba(0,0,0,0.5); /* Ombre portée */
    
    /* Dégradé sur le texte (Webkit) */
    background: linear-gradient(to bottom, #ffffff 40%, #e2e8f0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; 
    
    /* Hack pour afficher le stroke autour du gradient text fill */
    filter: drop-shadow(0 0 2px rgba(251, 191, 36, 0.5));
  }
  /* Doublure pour le contour si le stroke coupe le gradient (fallback) */
  .title::before {
    content: 'WELCOME OFFER';
    position: absolute;
    left: 0; top: 0;
    -webkit-text-stroke: 6px #d97706; /* Contour plus large derrière */
    z-index: -1;
    -webkit-text-fill-color: transparent;
  }


  /* --- GRID DES JOURS --- */
  .days-wrapper {
    display: flex;
    align-items: flex-end; /* Alignés par le bas */
    gap: 8px; /* Espace réduit entre les flèches */
    height: 180px;
    position: relative;
    z-index: 5;
    padding-left: 20px; /* Décalage pour centrer visuellement */
  }

  /* --- ITEM JOUR --- */
  .day-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    width: 95px;
  }

  /* 1. La Boîte (Cube) */
  .box-container {
    width: 100%;
    height: 95px;
    border-radius: 12px;
    background: #333; /* Default */
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 5px;
    position: relative;
    z-index: 2;
  }

  /* 2. Le Label Flèche (En dessous) */
  .arrow-label {
    width: 110%; /* Plus large que la boîte pour l'effet chaine */
    height: 35px;
    margin-top: -5px; /* Chevauchement */
    background: #555;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    
    /* Forme de Flèche vers la droite */
    clip-path: polygon(0% 0%, 85% 0%, 100% 50%, 85% 100%, 0% 100%, 15% 50%);
    
    font-size: 14px;
    font-weight: 900;
    color: white;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    padding-left: 10px; /* Compenser le creux de la flèche à gauche */
  }

  /* Texte "20+" */
  .amount-text {
    font-size: 20px;
    font-weight: 900;
    color: white;
    z-index: 5;
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
    margin-bottom: -5px;
  }
  
  /* Image Cadeau */
  .gift-icon {
    width: 70px;
    height: 70px;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4));
    z-index: 4;
  }

  /* --- ÉTATS (COULEURS) --- */

  /* VERT (Jours 1-3) */
  .day-item.green .box-container {
    background: linear-gradient(180deg, #4ade80 0%, #15803d 100%);
    border-color: #86efac;
  }
  .day-item.green .arrow-label {
    background: linear-gradient(90deg, #16a34a, #15803d);
  }

  /* OR (Jour 4 - Actif) */
  .day-item.gold {
    width: 120px; /* Plus large */
    margin: 0 10px; /* Espace autour */
    transform: translateY(-15px); /* Remonté */
  }
  .day-item.gold .box-container {
    height: 120px; /* Plus haut */
    background: linear-gradient(180deg, #fde047 0%, #d97706 100%);
    border-color: #fff;
    box-shadow: 0 0 30px rgba(251, 191, 36, 0.6); /* Glow */
  }
  .day-item.gold .arrow-label {
    background: linear-gradient(90deg, #d97706, #b45309);
    height: 40px;
    font-size: 16px;
  }
  /* Effet de brillance derrière le cadeau or */
  .day-item.gold::before {
    content: '';
    position: absolute;
    top: -20px; left: -20px; right: -20px; bottom: 20px;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
    opacity: 0.3;
    z-index: 0;
    animation: rotateLight 10s linear infinite;
  }

  /* Texte "Ready to Claim" */
  .claim-hint {
    position: absolute;
    bottom: -30px;
    width: 200%;
    text-align: center;
    color: #fde047;
    font-weight: 900;
    font-size: 12px;
    text-transform: uppercase;
    text-shadow: 0 0 5px #d97706;
  }

  /* GRIS (Jours 5-7) */
  .day-item.grey .box-container {
    background: linear-gradient(180deg, #94a3b8 0%, #475569 100%);
    border-color: #cbd5e1;
  }
  .day-item.grey .arrow-label {
    background: linear-gradient(90deg, #64748b, #475569);
  }
  .day-item.grey .gift-icon {
    filter: grayscale(1) brightness(0.7);
    opacity: 0.6;
  }

  /* --- BOUTON --- */
  .cta-button {
    position: absolute;
    bottom: 25px;
    right: 25px;
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    border: 2px solid #60a5fa;
    border-radius: 12px;
    padding: 12px 30px;
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 20px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 0 #1e3a8a, 0 10px 20px rgba(0,0,0,0.5); /* Effet 3D Button */
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    z-index: 20;
    transition: transform 0.1s;
  }
  .cta-button:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #1e3a8a, inset 0 2px 5px rgba(0,0,0,0.5);
  }

  /* --- DECOR --- */
  .decor { position: absolute; pointer-events: none; }
  .rocket-decor { 
      top: 60px; left: 40px; width: 50px; 
      transform: rotate(45deg); 
      filter: drop-shadow(0 0 10px rgba(255,100,0,0.5));
  }
  .planet-decor {
      bottom: -20px; left: -20px; width: 100px; opacity: 0.8;
  }
  .star-decor {
      top: 20%; right: 20%; color: white; font-size: 20px;
      animation: twinkle 2s infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

</style>
</head>
<body>

<svg style="display: none;">
  <defs>
    <symbol id="gift-3d" viewBox="0 0 100 100">
       <path d="M10 30 L50 40 L50 90 L10 75 Z" fill="#b91c1c"/> 
       <path d="M50 40 L90 30 L90 75 L50 90 Z" fill="#991b1b"/>
       <path d="M10 30 L50 20 L90 30 L50 40 Z" fill="#ef4444"/>
       <path d="M45 40 L55 40 L55 90 L45 90 Z" fill="#fbbf24"/>
       <path d="M45 22 L55 22 L55 40 L45 40 Z" fill="#fcd34d"/>
       <path d="M10 30 L50 20 L90 30 L50 40 Z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="10, 80"/> <circle cx="30" cy="15" r="6" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
       <circle cx="70" cy="10" r="6" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
    </symbol>
    
    <symbol id="lock-icon" viewBox="0 0 24 24">
       <path fill="#e2e8f0" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
    </symbol>
    
    <symbol id="rocket-icon" viewBox="0 0 24 24">
       <path fill="#f44336" d="M12,2.5C10.5,2.5 9,3 8,4C6.5,5.5 6,7.5 6,9.5C6,12 7.5,14.5 9,16.5L12,22L15,16.5C16.5,14.5 18,12 18,9.5C18,7.5 17.5,5.5 16,4C15,3 13.5,2.5 12,2.5M12,11.5A2,2 0 0,1 10,9.5A2,2 0 0,1 12,7.5A2,2 0 0,1 14,9.5A2,2 0 0,1 12,11.5Z"/>
    </symbol>
  </defs>
</svg>

<div class="banner-container">
  <div class="decor star-decor">✦</div>
  <svg class="decor rocket-decor" viewBox="0 0 24 24"><use href="#rocket-icon"/></svg>
  
  <div class="title-wrapper">
    <div class="title">WELCOME OFFER</div>
  </div>

  <div class="days-wrapper">
    
    <div class="day-item green">
      <div class="box-container">
        <div class="amount-text">20+</div>
        <svg class="gift-icon"><use href="#gift-3d"/></svg>
      </div>
      <div class="arrow-label">DAY 1</div>
    </div>

    <div class="day-item green">
      <div class="box-container">
        <div class="amount-text">20+</div>
        <svg class="gift-icon"><use href="#gift-3d"/></svg>
      </div>
      <div class="arrow-label">DAY 2</div>
    </div>

    <div class="day-item green">
      <div class="box-container">
        <div class="amount-text">20+</div>
        <svg class="gift-icon"><use href="#gift-3d"/></svg>
      </div>
      <div class="arrow-label">DAY 3</div>
    </div>

    <div class="day-item gold">
      <div class="box-container">
        <div class="amount-text">20+</div>
        <svg class="gift-icon" style="transform: scale(1.2);"><use href="#gift-3d"/></svg>
      </div>
      <div class="arrow-label">DAY 4</div>
      <div class="claim-hint">READY TO CLAIM</div>
    </div>

    <div class="day-item grey">
      <div class="box-container">
        <div class="amount-text">20+</div>
        <svg class="gift-icon"><use href="#lock-icon"/></svg>
      </div>
      <div class="arrow-label">DAY 5</div>
    </div>

    <div class="day-item grey">
      <div class="box-container">
        <div class="amount-text">20+</div>
        <svg class="gift-icon"><use href="#lock-icon"/></svg>
      </div>
      <div class="arrow-label">DAY 6</div>
    </div>

    <div class="day-item grey">
      <div class="box-container">
        <div class="amount-text">20+</div>
        <svg class="gift-icon"><use href="#lock-icon"/></svg>
      </div>
      <div class="arrow-label">DAY 7</div>
    </div>

  </div>

  <button class="cta-button">CLAIM NOW</button>

</div>

</body>
</html>
