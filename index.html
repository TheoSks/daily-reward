<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Casino Daily Rewards</title>
    <style>
        /* Importation de la police 'Montserrat' pour le look moderne/sportif */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,800&display=swap');

        :root {
            /* Palette Rocket Casino */
            --space-bg: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.95);
            --neon-blue: #00f0ff;
            --neon-purple: #bd00ff;
            --gold: #fbbf24;
            --gold-gradient: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            --success: #10b981;
            --locked: #64748b;
            --locked-bg: #334155;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #000; /* Fallback */
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            background-color: #020617; /* Fond étoilé simulé */
            font-family: 'Montserrat', sans-serif;
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Conteneur Principal --- */
        .rocket-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* Effet de brillance en haut du cadre */
        .rocket-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        }

        /* --- Titre --- */
        h1 {
            font-size: 2.5rem;
            font-style: italic;
            text-transform: uppercase;
            margin: 0 0 2rem 0;
            text-align: left;
            text-shadow: 2px 2px 0px #000;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        /* --- Barre de Progression "SPEED WING" --- */
        .progress-track {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            padding: 0 5px;
        }

        .wing-segment {
            flex: 1;
            height: 55px;
            background: var(--locked-bg);
            
            /* FORME AILERON / FUSÉE */
            clip-path: polygon(15% 0, 100% 0, 85% 100%, 0% 100%);
            
            margin: 0 -2px; /* Chevauchement léger pour l'aérodynamisme */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-top: 2px solid rgba(255,255,255,0.05);
        }

        .wing-segment svg {
            width: 24px;
            height: 24px;
            fill: #94a3b8;
            /* On redresse l'icône visuellement */
            transform: skewX(10deg); 
            z-index: 2;
        }

        /* États des segments */
        .wing-segment.completed {
            background: var(--success);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .wing-segment.completed svg { fill: white; }

        .wing-segment.active {
            background: var(--gold-gradient);
            transform: scale(1.15) skewX(-5deg); /* Petit effet de "pop" */
            z-index: 10;
            box-shadow: 0 10px 20px rgba(251, 191, 36, 0.3);
        }
        .wing-segment.active svg { 
            fill: #78350f;
            transform: skewX(5deg);
        }

        /* --- Grille des Jours --- */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            margin-bottom: 2rem;
        }

        .day-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .day-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .reward-card {
            width: 100%;
            aspect-ratio: 1;
            background: #1e293b;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .reward-card svg {
            width: 50%;
            height: 50%;
            fill: #475569;
        }

        /* États des cartes */
        .day-column.completed .reward-card {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
        }
        .day-column.completed .circle-bg {
            background: var(--success);
            border-radius: 50%;
            width: 70%; height: 70%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 0 #047857;
        }
        .day-column.completed svg { fill: white; width: 60%; height: 60%; }

        /* JOUR ACTIF (Highlight) */
        .day-column.active .day-label { color: var(--gold); }
        .day-column.active .reward-card {
            background: rgba(251, 191, 36, 0.1);
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
            animation: float 3s ease-in-out infinite;
        }
        .day-column.active svg {
            fill: var(--gold);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            width: 65%; height: 65%;
        }

        /* --- Bouton Claim --- */
        .footer {
            display: flex;
            justify-content: flex-end;
        }

        .claim-btn {
            background: transparent;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            font-style: italic;
            color: #fff;
            padding: 15px 50px;
            border: 2px solid var(--neon-blue);
            border-radius: 12px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0, 240, 255, 0.1);
            text-shadow: 0 0 5px var(--neon-blue);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .claim-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px) skewX(-10deg);
            text-shadow: none;
        }

        .claim-btn:active {
            transform: translateY(1px);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Responsive Mobile */
        @media (max-width: 600px) {
            .rocket-container { padding: 1.5rem 1rem; }
            h1 { font-size: 1.8rem; text-align: center; }
            
            .days-grid {
                grid-template-columns: repeat(4, 1fr); /* 4 en haut */
            }
            .day-column:nth-child(n+5) {
                grid-column: span 1; /* Le reste en dessous */
            }
            /* Centrer les 3 derniers jours */
            .day-column:nth-child(5) { grid-column-start: 1; } 
            
            /* Ajustement Ailerons sur mobile */
            .wing-segment { clip-path: none; transform: skewX(-20deg); border-radius: 4px; }
            .wing-segment.active { transform: scale(1.1) skewX(-20deg); }
            .wing-segment svg { transform: skewX(20deg); }
            
            .claim-btn { width: 100%; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<script>
    function triggerClaim() {
        const btn = document.querySelector('.claim-btn');
        const day4 = document.getElementById('currentDay');
        const progressSegments = document.querySelectorAll('.wing-segment');

        // 1. Animation du Bouton
        btn.innerText = "CLAIMED!";
        btn.style.borderColor = "#10b981";
        btn.style.boxShadow = "0 0 30px #10b981";
        btn.disabled = true;

        // 2. Transformer la carte du jour 4
        day4.classList.remove('active');
        day4.classList.add('completed');
        
        // Remplacer l'icone par le check vert
        const cardInner = day4.querySelector('.reward-card');
        cardInner.innerHTML = '<div class="circle-bg" style="transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);"><svg viewBox="0 0 24 24" style="fill:white; width:60%; height:60%"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>';
        
        // Petit délai pour l'effet "pop" du check
        setTimeout(() => {
            cardInner.querySelector('.circle-bg').style.transform = 'scale(1)';
        }, 100);

        // 3. Mettre à jour la barre de progression en haut
        const activeSegment = progressSegments[3]; // Le 4ème (index 3)
        activeSegment.classList.remove('active');
        activeSegment.classList.add('completed');
        activeSegment.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
    }
</script>
