<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Welcome Offer Fix</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0a0a2a;
    --bg-light: #1a1a4a;
    --text-gold: #ffd700;
    --text-white: #ffffff;
    --color-green: #28a745;
    --color-green-dark: #1e7e34;
    --color-yellow: #ffc107;
    --color-yellow-dark: #d39e00;
    --color-grey: #495057;
  }

  body {
    margin: 0;
    padding: 20px;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
  }

  /* --- CONTENEUR 369x80 --- */
  .banner-container {
    position: relative;
    width: 369px;  /* Largeur Fixe */
    height: 80px;  /* Hauteur Fixe */
    background: radial-gradient(circle at left, var(--bg-light) 0%, var(--bg-dark) 100%);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    display: flex; /* Layout Horizontal */
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    box-sizing: border-box;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* Décoration de fond */
  .bg-decor { position: absolute; pointer-events: none; opacity: 0.5; }
  
  /* --- SECTION GAUCHE : TITRE --- */
  .left-section {
    flex: 0 0 35%; /* Prend 35% de la largeur */
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 2;
    padding-right: 10px;
    border-right: 1px solid rgba(255,255,255,0.1);
  }

  .title {
    font-size: 14px;
    line-height: 1;
    font-weight: 900;
    text-transform: uppercase;
    background: linear-gradient(to right, #ffffff, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  
  .subtitle {
    font-size: 10px;
    color: #cbd5e1;
    font-weight: 700;
  }

  .claim-badge {
    margin-top: 5px;
    background: var(--color-yellow);
    color: #000;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 800;
    display: inline-block;
    text-align: center;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    cursor: pointer;
  }

  /* --- SECTION DROITE : LISTE DÉFILANTE --- */
  .scroll-container {
    flex: 1; /* Prend le reste de la place */
    height: 100%;
    display: flex;
    align-items: center;
    overflow-x: auto; /* Permet le scroll horizontal */
    overflow-y: hidden;
    /* Cache la scrollbar */
    scrollbar-width: none; 
    -ms-overflow-style: none;
    mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
  }
  .scroll-container::-webkit-scrollbar { display: none; }

  .days-track {
    display: flex;
    gap: 6px;
    padding: 0 10px; /* Espace pour le scroll */
  }

  /* --- ITEMS JOURS --- */
  .day-item {
    min-width: 45px;
    height: 60px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    background: #2a2a40;
    border: 1px solid #4a4a60;
    padding: 2px 0;
  }

  /* Header du jour (20+) */
  .day-val {
    font-size: 10px;
    font-weight: 900;
    color: white;
    z-index: 2;
    text-shadow: 0 1px 2px black;
  }

  /* Icone Cadeau */
  .icon-box {
    width: 24px;
    height: 24px;
    margin-top: -2px;
  }
  
  /* Footer du jour (Day X) */
  .day-label {
    font-size: 7px;
    color: #aaa;
    text-transform: uppercase;
    background: rgba(0,0,0,0.3);
    width: 100%;
    text-align: center;
    border-radius: 0 0 5px 5px;
    padding: 2px 0;
  }

  /* --- ETATS --- */
  /* Validé */
  .day-item.completed {
    background: linear-gradient(180deg, var(--color-green), var(--color-green-dark));
    border-color: #86efac;
  }
  
  /* Actif (Highlight) */
  .day-item.active {
    min-width: 50px; /* Un peu plus large */
    height: 64px; /* Un peu plus grand */
    background: linear-gradient(180deg, var(--color-yellow), var(--color-yellow-dark));
    border: 1px solid white;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    z-index: 10;
  }
  .day-item.active .day-val { color: #5c3a00; }
  .day-item.active .day-label { color: #5c3a00; background: rgba(255,255,255,0.3); }

  /* Verrouillé */
  .day-item.locked { opacity: 0.6; }

</style>
</head>
