<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Casino Banner - Pixel Perfect</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Couleurs exactes de la ref */
    --bg-dark: #050a1f;
    --green-top: #4ade80; --green-bot: #166534;
    --gold-top: #fef08a; --gold-mid: #fbbf24; --gold-bot: #b45309;
    --grey-top: #9ca3af; --grey-bot: #374151;
    --red-box: #dc2626; --red-ribbon: #fbbf24;
    --btn-blue-top: #3b82f6; --btn-blue-bot: #1d4ed8;
  }

  body {
    margin: 0;
    padding: 20px;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
  }

  /* --- CONTENEUR --- */
  .banner {
    position: relative;
    width: 920px; /* Ratio large */
    height: 400px;
    background: radial-gradient(circle at 50% 30%, #172554 0%, #020617 80%);
    border-radius: 12px;
    overflow: hidden; /* Masque ce qui dépasse */
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid #1e3a8a;
  }

  /* --- DÉCOR (Planètes/Fusées) --- */
  .decor { position: absolute; pointer-events: none; z-index: 1; }
  .planet-blue { bottom: -40px; left: -40px; width: 120px; opacity: 0.9; }
  .planet-saturn { top: -20px; right: -20px; width: 140px; opacity: 0.9; }
  .rocket-left { top: 80px; left: 40px; width: 50px; transform: rotate(45deg); }
  .rocket-right { top: 80px; right: 50px; width: 50px; transform: rotate(-45deg); }
  .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite; }

  @keyframes twinkle { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* --- TITRE --- */
  .title {
    margin-top: 25px;
    font-family: 'Titan One', cursive;
    font-size: 68px;
    text-transform: uppercase;
    color: white;
    z-index: 5;
    position: relative;
    line-height: 1;
    /* Dégradé sur le texte blanc/gris clair */
    background: linear-gradient(to bottom, #fff 40%, #bfdbfe 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    /* Contour et Ombre */
    filter: drop-shadow(0 2px 0 #b45309) drop-shadow(0 4px 0 #000);
    -webkit-text-stroke: 2px #d97706; /* Contour doré fin */
  }

  /* --- GRID DES JOURS --- */
  .days-grid {
    display: flex;
    align-items: flex-end; /* Alignement bas pour gérer la hauteur variable */
    justify-content: center;
    gap: 4px; /* Espace très fin entre les flèches */
    margin-top: 20px;
    z-index: 10;
    position: relative;
    padding-bottom: 30px; /* Place pour les ombres/labels */
  }

  /* --- ITEM JOUR (Structure) --- */
  .day-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    width: 105px; /* Largeur standard */
  }

  /* BOITE DU HAUT (Carré avec cadeau) */
  .day-box {
    width: 100%;
    height: 105px;
    border-radius: 8px 8px 0 0; /* Arrondi haut seulement */
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end; /* Cadeau posé au fond */
    padding-bottom: 5px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    border: 2px solid rgba(255,255,255,0.2);
    border-bottom: none;
    background: #333;
  }
  
  /* TEXTE "20+" */
  .amount {
    position: absolute;
    top: 10px;
    font-family: 'Titan One', cursive;
    font-size: 24px;
    color: #fde047; /* Jaune */
    -webkit-text-stroke: 1px #854d0e; /* Contour foncé */
    text-shadow: 0 2px 2px rgba(0,0,0,0.5);
    z-index: 10;
  }

  /* LABEL DU BAS (Flèche/Chevron) */
  .day-label {
    width: 115%; /* Plus large pour l'emboîtement */
    height: 35px;
    margin-top: -1px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 800;
    font-size: 16px;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    /* Forme de flèche précise */
    clip-path: polygon(0% 0%, 90% 0%, 100% 50%, 90% 100%, 0% 100%, 10% 50%);
    padding-left: 5px; /* Compenser le creux gauche */
    position: relative;
    z-index: 2;
  }
  /* Bordure brillante simulée sur le label */
  .day-label::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 3px;
    background: rgba(0,0,0,0.3);
    z-index: -1;
  }

  /* --- VARIANTES DE COULEURS --- */

  /* 1. VERT (Jours 1-3) */
  .day-col.green .day-box {
    background: linear-gradient(180deg, #4ade80 0%, #15803d 100%);
    border-color: #86efac;
  }
  .day-col.green .day-label {
    background: linear-gradient(180deg, #22c55e 0%, #14532d 100%);
  }

  /* 2. OR (Jour 4) */
  .day-col.gold {
    width: 130px; /* Plus large */
    z-index: 20;
    margin: 0 5px;
  }
  .day-col.gold .day-box {
    height: 130px; /* Plus haut */
    background: linear-gradient(180deg, #fef08a 0%, #d97706 100%);
    border: 3px solid #fff;
    border-bottom: none;
    box-shadow: 0 0 40px rgba(251, 191, 36, 0.6); /* Glow externe */
  }
  .day-col.gold .day-label {
    height: 45px;
    font-size: 18px;
    background: linear-gradient(180deg, #fbbf24 0%, #b45309 100%);
    clip-path: polygon(0% 0%, 92% 0%, 100% 50%, 92% 100%, 0% 100%, 8% 50%);
  }
  /* Rayon de lumière derrière le cadeau */
  .day-col.gold .day-box::before {
    content: '';
    position: absolute;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
    top: -20%;
    z-index: 0;
    opacity: 0.5;
  }
  .ready-text {
    position: absolute;
    bottom: -35px;
    font-weight: 900;
    color: #fde047;
    font-size: 13px;
    text-shadow: 0 2px 4px #000;
    white-space: nowrap;
    text-transform: uppercase;
  }

  /* 3. GRIS (Jours 5-7) */
  .day-col.grey .day-box {
    background: linear-gradient(180deg, #9ca3af 0%, #4b5563 100%);
    border-color: #d1d5db;
  }
  .day-col.grey .day-label {
    background: linear-gradient(180deg, #6b7280 0%, #374151 100%);
    color: #e5e7eb;
  }
  .day-col.grey .amount { color: #374151; -webkit-text-stroke: 0px; text-shadow: 0 1px 0 rgba(255,255,255,0.3); }

  /* --- ASSETS GRAPHIQUES (SVG) --- */
  .gift-svg { width: 80%; height: auto; z-index: 5; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4)); }
  .lock-svg { width: 60%; z-index: 5; fill: #e5e7eb; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); opacity: 0.9; }
  
  /* Silhouette cadeau gris */
  .gift-silhouette {
    position: absolute;
    bottom: 5px;
    width: 70%;
    height: 60%;
    background: rgba(0,0,0,0.2);
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%); /* Forme trapèze simple */
    z-index: 1;
  }

  /* --- BOUTON --- */
  .btn-claim {
    position: absolute;
    bottom: 30px;
    right: 40px;
    background: linear-gradient(180deg, var(--btn-blue-top) 0%, var(--btn-blue-bot) 100%);
    padding: 12px 35px;
    border-radius: 10px;
    border: 2px solid #60a5fa;
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 22px;
    text-transform: uppercase;
    box-shadow: 
        0 4px 0 #1e3a8a, /* Effet 3D bas */
        0 0 15px rgba(59, 130, 246, 0.5); /* Glow */
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    z-index: 50;
  }

</style>
</head>
<body>

<svg style="display: none;">
  <defs>
    <symbol id="gift-closed" viewBox="0 0 100 100">
      <path d="M15 35 L50 45 L85 35 L50 25 Z" fill="#ef4444"/> <path d="M15 35 L50 45 L50 90 L15 80 Z" fill="#b91c1c"/> <path d="M50 45 L85 35 L85 80 L50 90 Z" fill="#991b1b"/> <rect x="45" y="45" width="10" height="45" fill="#fbbf24"/> <path d="M45 27 L55 27 L55 45 L45 45 Z" fill="#fcd34d"/> <circle cx="35" cy="20" r="7" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
      <circle cx="65" cy="22" r="7" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
    </symbol>

    <symbol id="gift-open" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="#fef08a" opacity="0.8" filter="blur(5px)"/>
      <path d="M15 50 L50 60 L50 95 L15 85 Z" fill="#b91c1c"/>
      <path d="M50 60 L85 50 L85 85 L50 95 Z" fill="#991b1b"/>
      <rect x="45" y="60" width="10" height="35" fill="#fbbf24"/>
      <g transform="translate(0, -25) rotate(-10 50 50)">
         <path d="M12 35 L50 45 L88 35 L50 25 Z" fill="#ef4444"/>
         <path d="M12 35 L50 45 L50 55 L12 45 Z" fill="#b91c1c"/>
         <path d="M50 45 L88 35 L88 45 L50 55 Z" fill="#991b1b"/>
         <path d="M45 27 L55 27 L55 45 L45 45 Z" fill="#fcd34d"/>
      </g>
      <circle cx="20" cy="20" r="6" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
      <circle cx="80" cy="30" r="7" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
      <circle cx="50" cy="10" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
    </symbol>

    <symbol id="lock" viewBox="0 0 24 24">
      <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
    </symbol>
    
    <symbol id="rocket" viewBox="0 0 24 24">
      <path fill="#e2e8f0" d="M12,2.5C10.5,2.5 9,3 8,4C6.5,5.5 6,7.5 6,9.5C6,12 7.5,14.5 9,16.5L12,22L15,16.5C16.5,14.5 18,12 18,9.5C18,7.5 17.5,5.5 16,4C15,3 13.5,2.5 12,2.5M12,11.5A2,2 0 0,1 10,9.5A2,2 0 0,1 12,7.5A2,2 0 0,1 14,9.5A2,2 0 0,1 12,11.5Z"/>
      <path fill="#f43f5e" d="M12 2.5 C12 2.5 14 5 15 9.5 L9 9.5 C10 5 12 2.5 12 2.5 Z"/>
      <path fill="#fbbf24" d="M9 16.5 L12 22 L15 16.5 Z"/>
    </symbol>
    
    <symbol id="planet" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="url(#planetGrad)"/>
      <ellipse cx="50" cy="50" rx="60" ry="15" fill="none" stroke="#60a5fa" stroke-width="4" transform="rotate(-20 50 50)"/>
      <defs>
        <radialGradient id="planetGrad">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#172554"/>
        </radialGradient>
      </defs>
    </symbol>
  </defs>
</svg>

<div class="banner">
  <div class="star" style="top:10%; left:20%; width:3px; height:3px;"></div>
  <div class="star" style="top:40%; right:30%; width:2px; height:2px; animation-delay: 1s;"></div>
  <svg class="decor planet-blue"><use href="#planet"/></svg>
  <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgZmlsbD0iI2Q5NzcwNiIvPjxwYXRoIGQ9Ik0xMCA2MCBDMzAgODAgNzAgODAgOTAgNjAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZkZTA0NyIHN0cm9rZS13aWR0aD0iNSIvPjwvc3ZnPg==" class="decor planet-saturn" alt="Saturn">
  <svg class="decor rocket-left"><use href="#rocket"/></svg>
  <svg class="decor rocket-right"><use href="#rocket"/></svg>

  <h1 class="title">WELCOME OFFER</h1>

  <div class="days-grid">
    
    <div class="day-col green">
      <div class="day-box">
        <span class="amount">20+</span>
        <svg class="gift-svg"><use href="#gift-closed"/></svg>
      </div>
      <div class="day-label">DAY 1</div>
    </div>

    <div class="day-col green">
      <div class="day-box">
        <span class="amount">20+</span>
        <svg class="gift-svg"><use href="#gift-closed"/></svg>
      </div>
      <div class="day-label">DAY 2</div>
    </div>

    <div class="day-col green">
      <div class="day-box">
        <span class="amount">20+</span>
        <svg class="gift-svg"><use href="#gift-closed"/></svg>
      </div>
      <div class="day-label">DAY 3</div>
    </div>

    <div class="day-col gold">
      <div class="day-box">
        <span class="amount">20+</span>
        <svg class="gift-svg" style="width: 90%;"><use href="#gift-open"/></svg>
      </div>
      <div class="day-label">DAY 4</div>
      <div class="ready-text">READY TO CLAIM</div>
    </div>

    <div class="day-col grey">
      <div class="day-box">
        <span class="amount">20+</span>
        <div class="gift-silhouette"></div>
        <svg class="lock-svg"><use href="#lock"/></svg>
      </div>
      <div class="day-label">DAY 5</div>
    </div>

    <div class="day-col grey">
      <div class="day-box">
        <span class="amount">20+</span>
        <div class="gift-silhouette"></div>
        <svg class="lock-svg"><use href="#lock"/></svg>
      </div>
      <div class="day-label">DAY 6</div>
    </div>

    <div class="day-col grey">
      <div class="day-box">
        <span class="amount">20+</span>
        <div class="gift-silhouette"></div>
        <svg class="lock-svg"><use href="#lock"/></svg>
      </div>
      <div class="day-label">DAY 7</div>
    </div>

  </div>

  <button class="btn-claim">CLAIM NOW</button>
</div>

</body>
</html>
