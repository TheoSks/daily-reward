<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Space Casino - Final Layout</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0B1120;
    --red-glossy: radial-gradient(circle at top left, #ef4444, #b91c1c);
    --card-bg: #1e293b;
    --card-border: rgba(255,255,255,0.15);
    --gold: #fbbf24;
    --green: #22c55e;
    --neon-blue: #0ea5e9;
  }

  body {
    margin: 0;
    padding: 20px;
    background-color: #111; /* Fond page sombre pour contraste */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
  }

  /* --- LE CONTENEUR BANNIÈRE --- */
  .banner-container {
    position: relative;
    width: 100%;
    max-width: 600px; /* S'adapte, max 600px */
    height: 90px;     /* Hauteur compacte type mobile */
    
    /* DA : Fond Bleu Nuit Spatial */
    background: radial-gradient(circle at 10% 50%, #172554 0%, #020617 100%);
    border-radius: 12px;
    overflow: hidden;
    
    /* DA : Effets de bordure et d'ombre */
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    box-sizing: border-box;
  }

  /* Éléments de fond (Étoiles/Formes) */
  .bg-decor { position: absolute; pointer-events: none; z-index: 0; }
  .star-1 { top: 10px; left: 40%; color: white; opacity: 0.6; font-size: 8px; }
  .star-2 { bottom: 15px; right: 10%; color: var(--neon-blue); opacity: 0.8; font-size: 10px; }
  .planet-bg { 
    width: 100px; height: 100px; 
    background: radial-gradient(circle, rgba(14, 165, 233, 0.1) 0%, transparent 70%);
    top: -30px; left: -20px; border-radius: 50%;
  }

  /* --- PARTIE GAUCHE : TITRE --- */
  .left-section {
    flex: 0 0 auto;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 15px;
    border-right: 1px solid rgba(255,255,255,0.1); /* Séparateur subtil */
    margin-right: 10px;
  }

  .title {
    font-family: 'Montserrat', sans-serif;
    font-style: italic;
    font-weight: 900;
    font-size: 18px;
    line-height: 1;
    color: white;
    text-transform: uppercase;
    
    /* DA : Typo Space Casino (Contour Noir) */
    -webkit-text-stroke: 1.2px black;
    text-shadow: 2px 2px 0px #000;
    transform: skewX(-5deg); /* Légère inclinaison vitesse */
  }
  .title span {
    color: var(--gold);
    font-size: 1.1em;
    display: block;
  }

  .claim-badge {
    margin-top: 4px;
    font-size: 9px;
    font-weight: 800;
    background: var(--gold);
    color: #000;
    padding: 2px 8px;
    border-radius: 4px;
    text-align: center;
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
    cursor: pointer;
    transform: skewX(-5deg);
    display: inline-block;
    width: fit-content;
  }

  /* --- PARTIE DROITE : SCROLL --- */
  .scroll-wrapper {
    flex: 1;
    height: 100%;
    z-index: 2;
    overflow-x: auto;
    display: flex;
    align-items: center;
    
    /* Masquer scrollbar */
    scrollbar-width: none;
    -ms-overflow-style: none;
    
    /* Masque dégradé pour l'effet infini */
    mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
    
    padding-left: 5px;
  }
  .scroll-wrapper::-webkit-scrollbar { display: none; }

  .items-list {
    display: flex;
    gap: 8px;
    align-items: center;
    padding-right: 15px; /* Espace fin de scroll */
  }

  /* --- LES CARTES (DA Space) --- */
  .card {
    width: 50px;
    height: 50px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 1px solid var(--card-border);
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  /* 1. CARTE ROUGE (Highlight) */
  .card.red-reward {
    width: 55px; height: 55px; /* Un peu plus grosse */
    background: var(--red-glossy);
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
    flex-direction: column;
  }
  .card.red-reward svg {
    width: 22px; height: 22px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
    margin-bottom: -2px;
  }
  .card.red-reward .val {
    font-size: 11px;
    font-weight: 900;
    font-style: italic;
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }

  /* 2. CARTE BLEUE (Coin) */
  .card.blue-coin {
    background: var(--card-bg);
  }
  .card.blue-coin svg {
    width: 30px; height: 30px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }

  /* 3. CARTE VERTE (Check) */
  .card.green-check {
    background: rgba(34, 197, 94, 0.1);
    border-color: var(--green);
  }
  .card.green-check .circle {
    width: 24px; height: 24px;
    background: var(--green);
    border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 2px 0 #14532d;
  }
  .card.green-check svg { width: 14px; fill: white; }

  /* 4. CARTE GRISE (Lock) */
  .card.grey-lock {
    background: var(--card-bg);
    opacity: 0.6;
  }
  .card.grey-lock svg { width: 20px; fill: #64748b; }

  /* Label "Day X" sous les cartes */
  .day-label {
    position: absolute;
    bottom: -16px;
    font-size: 8px;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    width: 100%;
    text-align: center;
  }
  .card.red-reward + .day-label { color: var(--gold); bottom: -18px; }

</style>
</head>
<body>

<div class="banner-container">
  <div class="bg-decor planet-bg"></div>
  <div class="bg-decor star-1">✦</div>
  <div class="bg-decor star-2">✦</div>

  <div class="left-section">
    <div class="title">Welcome<br><span>Offer</span></div>
    <div class="claim-badge">CLAIM ></div>
  </div>

  <div class="scroll-wrapper">
    <div class="items-list">
      
      <div style="position:relative">
        <div class="card red-reward">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
            <path d="M10 8h4v8h-4z" fill="#b45309" opacity="0.3"/> 
            <path d="M12 6v12" stroke="#b45309" stroke-width="2"/>
          </svg>
          <div class="val">x20</div>
        </div>
        <div class="day-label">Day 1</div>
      </div>

      <div style="position:relative">
        <div class="card blue-coin">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="11" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
            <text x="12" y="16" font-family="Arial" font-weight="bold" font-size="12" text-anchor="middle" fill="#b45309">$</text>
          </svg>
        </div>
        <div class="day-label">Day 2</div>
      </div>

      <div style="position:relative">
        <div class="card green-check">
          <div class="circle">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </div>
        </div>
        <div class="day-label">Day 3</div>
      </div>

      <div style="position:relative">
        <div class="card grey-lock">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        <div class="day-label">Day 4</div>
      </div>

      <div style="position:relative">
        <div class="card grey-lock">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        <div class="day-label">Day 5</div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
