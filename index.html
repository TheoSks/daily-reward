<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Fixed</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0B1120;
    --red-glossy: radial-gradient(circle at top left, #ef4444, #991b1b);
    --card-bg: #2B3855;
    --green: #22c55e;
  }

  body {
    margin: 0;
    padding: 20px;
    /* J'ai éclairci le fond pour qu'on voit bien la bannière si elle est sombre */
    background-color: #111; 
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
  }

  /* --- CONTENEUR --- */
  .banner-container {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 110px; /* Hauteur sécurisée */
    background: radial-gradient(circle at 20% 50%, #1e3a8a 0%, #0f172a 100%);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    box-sizing: border-box;
    /* Bordure blanche fine pour bien délimiter la bannière du fond noir */
    border: 1px solid rgba(255,255,255,0.2); 
  }

  /* Formes de fond */
  .bg-shape {
    position: absolute;
    background: rgba(255,255,255,0.05);
    pointer-events: none;
    z-index: 0;
  }
  .shape-1 { width: 80px; height: 80px; transform: rotate(45deg); top: -40px; left: 15%; }
  .shape-2 { width: 120px; height: 120px; border-radius: 50%; bottom: -50px; right: 10%; background: rgba(0, 255, 255, 0.05); }

  /* --- GAUCHE : TITRE --- */
  .left-section {
    z-index: 2;
    flex-shrink: 0;
    margin-right: 15px;
  }

  .title {
    font-family: 'Montserrat', sans-serif;
    font-style: italic;
    font-weight: 900;
    font-size: 24px;
    line-height: 0.9;
    color: white;
    text-transform: capitalize;
    /* Contour noir pour la lisibilité */
    -webkit-text-stroke: 1.5px black;
    text-shadow: 3px 3px 0px #000;
    transform: rotate(-3deg);
  }
  .title span { font-size: 0.8em; display: block; }

  /* --- DROITE : SCROLL --- */
  .scroll-container {
    flex: 1;
    z-index: 2;
    overflow-x: auto;
    /* Masquer la scrollbar proprement */
    scrollbar-width: none;
    -ms-overflow-style: none;
    mask-image: linear-gradient(to right, transparent, black 10%, black 95%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 95%, transparent);
    padding: 10px 0 10px 10px;
    display: flex;
    align-items: center;
  }
  .scroll-container::-webkit-scrollbar { display: none; }

  .items-track {
    display: flex;
    gap: 12px;
    padding-right: 15px;
  }

  /* --- CARTES --- */
  .item-card {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* 1. Rouge (Bonus) */
  .item-card.reward-red {
    background: var(--red-glossy);
    flex-direction: column;
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
  }
  .item-card.reward-red svg {
    width: 24px;
    height: 24px;
    margin-bottom: -4px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
  }
  .item-card.reward-red .text-val {
    font-size: 14px;
    font-weight: 900;
    font-style: italic;
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }

  /* 2. Bleu (Coin) */
  .item-card.coin-blue { background: var(--card-bg); }
  .item-card.coin-blue svg { width: 34px; height: 34px; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.5)); }

  /* 3. Vert (Check) */
  .item-card.check-green { background: var(--card-bg); }
  .item-card.check-green .circle {
    width: 32px; height: 32px;
    background: var(--green);
    border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 2px 0 #166534;
  }
  .item-card.check-green svg { width: 20px; fill: white; }

  /* 4. Gris (Lock) */
  .item-card.lock-grey { background: var(--card-bg); opacity: 0.6; }
  .item-card.lock-grey svg { width: 26px; fill: #94a3b8; }

</style>
</head>
<body>

<div class="banner-container">
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="left-section">
    <div class="title">Welcome<br><span>Offer</span></div>
  </div>

  <div class="scroll-container">
    <div class="items-track">
      
      <div class="item-card reward-red">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
          <path d="M12 6v12M6 12h12" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div class="text-val">x20</div>
      </div>

      <div class="item-card coin-blue">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="11" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
          <path d="M8 10h3v4H8z" fill="#b45309" opacity="0.6"/>
          <path d="M13 10h3v4h-3z" fill="#b45309" opacity="0.6"/>
        </svg>
      </div>

      <div class="item-card check-green">
        <div class="circle">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
      </div>

      <div class="item-card lock-grey">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </div>
      
       <div class="item-card lock-grey">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </div>

    </div>
  </div>
</div>

</body>
</html>
