<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Reward - Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --betclic-red: #E30613;
            --betclic-red-dark: #B8050F;
            --dark-bg: #0D0D0D;
            --dark-card: #1A1A1A;
            --dark-elevated: #252525;
            --gold: #FFD700;
            --gold-dark: #CC9900;
            --text-primary: #FFFFFF;
            --text-secondary: #888;
            --success: #00C853;
            --locked: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* ========== WIDGET COMPACT MOBILE ========== */
        .daily-reward-widget {
            background: var(--dark-card);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(227, 6, 19, 0.4);
            box-shadow: 0 0 20px rgba(227, 6, 19, 0.15);
        }

        /* Header compact */
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .widget-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gift-icon {
            width: 28px;
            height: 28px;
            background: var(--betclic-red);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .widget-title h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reward-badge {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            padding: 4px 10px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: #000;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Days Container - 64px height */
        .days-container {
            display: flex;
            gap: 4px;
            height: 64px;
        }

        /* Day Box */
        .day-box {
            flex: 1;
            background: var(--dark-elevated);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px 2px;
            border: 1.5px solid transparent;
            transition: all 0.2s;
            min-width: 0;
        }

        .day-box .day-num {
            font-size: 8px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .day-box .day-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border-radius: 50%;
            background: var(--locked);
        }

        .day-box .day-reward {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 700;
            color: var(--gold);
        }

        /* Claimed */
        .day-box.claimed {
            background: linear-gradient(145deg, #1a2e1a 0%, #142414 100%);
            border-color: var(--success);
        }

        .day-box.claimed .day-icon {
            background: var(--success);
            box-shadow: 0 0 8px rgba(0, 200, 83, 0.4);
        }

        .day-box.claimed .day-icon::after {
            content: '✓';
            color: #fff;
            font-size: 12px;
            font-weight: bold;
        }

        .day-box.claimed .day-reward {
            color: var(--success);
        }

        /* Claimable */
        .day-box.claimable {
            background: linear-gradient(145deg, #3a1212 0%, #280d0d 100%);
            border-color: var(--betclic-red);
            box-shadow: 0 0 15px rgba(227, 6, 19, 0.4);
            animation: pulse-red 1.5s ease-in-out infinite;
            transform: scale(1.02);
            z-index: 1;
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 15px rgba(227, 6, 19, 0.4); }
            50% { box-shadow: 0 0 25px rgba(227, 6, 19, 0.6); }
        }

        .day-box.claimable .day-num {
            color: var(--text-primary);
        }

        .day-box.claimable .day-icon {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Unclaimed */
        .day-box.unclaimed {
            opacity: 0.5;
            border-color: #444;
        }

        .day-box.unclaimed .day-icon::after {
            content: '✕';
            color: #666;
            font-size: 10px;
        }

        .day-box.unclaimed .day-reward {
            color: #555;
            text-decoration: line-through;
        }

        /* Locked */
        .day-box.locked {
            opacity: 0.4;
        }

        .day-box.locked .day-icon::after {
            content: '🔒';
            font-size: 10px;
        }

        /* Day 7 Special */
        .day-box.special {
            background: linear-gradient(145deg, #332200 0%, #221800 100%);
            border-color: var(--gold-dark);
        }

        .day-box.special.locked {
            opacity: 0.35;
        }

        .day-box.special .day-reward {
            font-size: 8px;
        }

        /* Claim Button */
        .claim-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: linear-gradient(135deg, var(--betclic-red) 0%, var(--betclic-red-dark) 100%);
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--betclic-red-dark);
            transition: all 0.1s;
        }

        .claim-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--betclic-red-dark);
        }

        /* Progress */
        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .progress-text {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .progress-text span {
            color: var(--betclic-red);
            font-weight: 700;
        }

        .progress-bar {
            width: 100px;
            height: 4px;
            background: var(--dark-elevated);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: var(--betclic-red);
            border-radius: 2px;
        }

        /* ========== MODAL MOBILE ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal {
            position: relative;
            width: 100%;
            max-width: 340px;
            background: var(--dark-card);
            border-radius: 16px;
            padding: 16px;
            border: 2px solid var(--betclic-red);
            box-shadow: 0 0 40px rgba(227, 6, 19, 0.3);
            transform: scale(0.95);
            transition: transform 0.2s;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 30px;
            height: 30px;
            background: var(--betclic-red);
            border: 2px solid var(--dark-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            color: #fff;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .modal-header p {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Modal Days Grid */
        .modal-days {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .modal-day {
            background: var(--dark-elevated);
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
            border: 2px solid transparent;
        }

        .modal-day .md-num {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .modal-day .md-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: var(--locked);
        }

        .modal-day .md-reward {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
        }

        .modal-day.claimed {
            border-color: var(--success);
            background: linear-gradient(145deg, #1a2e1a 0%, #142414 100%);
        }

        .modal-day.claimed .md-icon {
            background: var(--success);
        }

        .modal-day.claimed .md-icon::after {
            content: '✓';
            color: #fff;
            font-weight: bold;
        }

        .modal-day.claimed .md-reward {
            color: var(--success);
        }

        .modal-day.claimable {
            border-color: var(--betclic-red);
            background: linear-gradient(145deg, #3a1212 0%, #280d0d 100%);
            box-shadow: 0 0 15px rgba(227, 6, 19, 0.4);
        }

        .modal-day.claimable .md-icon {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .modal-day.unclaimed {
            opacity: 0.4;
            border-color: #444;
        }

        .modal-day.unclaimed .md-icon::after {
            content: '✕';
            color: #666;
        }

        .modal-day.locked {
            opacity: 0.35;
        }

        .modal-day.locked .md-icon::after {
            content: '🔒';
            font-size: 12px;
        }

        /* Day 7 Special */
        .modal-day-7 {
            background: linear-gradient(145deg, #332200 0%, #221800 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .modal-day-7.locked {
            opacity: 0.35;
        }

        .modal-day-7 .day7-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-day-7 .day7-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .modal-day-7 .day7-text h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: var(--gold);
            text-transform: uppercase;
        }

        .modal-day-7 .day7-text p {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .modal-day-7 .day7-reward {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--gold);
        }

        .modal-claim-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--betclic-red) 0%, var(--betclic-red-dark) 100%);
            border: none;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--betclic-red-dark);
        }

        .modal-claim-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--betclic-red-dark);
        }

        /* ========== REWARD POPUP ========== */
        .reward-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: var(--dark-card);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 200;
            border: 2px solid var(--gold);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.4);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .reward-popup.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .reward-popup .big-icon {
            font-size: 50px;
            display: block;
            margin-bottom: 12px;
        }

        .reward-popup h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .reward-popup .reward-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            top: -10px;
            animation: fall 2.5s linear forwards;
            border-radius: 2px;
        }

        @keyframes fall {
            to {
                top: 100vh;
                transform: rotate(720deg);
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 360px) {
            .widget-title h2 {
                font-size: 12px;
            }
            .reward-badge {
                font-size: 9px;
                padding: 3px 8px;
            }
            .day-box .day-num {
                font-size: 7px;
            }
            .day-box .day-icon {
                width: 20px;
                height: 20px;
                font-size: 10px;
            }
            .day-box .day-reward {
                font-size: 8px;
            }
            .days-container {
                height: 58px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Widget Mobile Compact -->
        <div class="daily-reward-widget" onclick="openModal()">
            <div class="widget-header">
                <div class="widget-title">
                    <div class="gift-icon">🎁</div>
                    <h2>Daily Reward</h2>
                </div>
                <div class="reward-badge">
                    🎰 20 FREE SPINS
                </div>
            </div>

            <!-- Days Progress - 64px -->
            <div class="days-container">
                <div class="day-box claimed">
                    <span class="day-num">D1</span>
                    <div class="day-icon"></div>
                    <span class="day-reward">+1</span>
                </div>
                <div class="day-box claimed">
                    <span class="day-num">D2</span>
                    <div class="day-icon"></div>
                    <span class="day-reward">+2</span>
                </div>
                <div class="day-box unclaimed">
                    <span class="day-num">D3</span>
                    <div class="day-icon"></div>
                    <span class="day-reward">+3</span>
                </div>
                <div class="day-box claimable">
                    <span class="day-num">D4</span>
                    <div class="day-icon">🪙</div>
                    <span class="day-reward">+4</span>
                </div>
                <div class="day-box locked">
                    <span class="day-num">D5</span>
                    <div class="day-icon"></div>
                    <span class="day-reward">+5</span>
                </div>
                <div class="day-box locked">
                    <span class="day-num">D6</span>
                    <div class="day-icon"></div>
                    <span class="day-reward">+5</span>
                </div>
                <div class="day-box locked special">
                    <span class="day-num">D7</span>
                    <div class="day-icon">🎁</div>
                    <span class="day-reward">+20</span>
                </div>
            </div>

            <button class="claim-btn" onclick="event.stopPropagation(); claimReward()">
                Claim Reward
            </button>

            <div class="progress-row">
                <span class="progress-text">Progression: <span>3/7</span></span>
                <div class="progress-bar">
                    <div class="fill" style="width: 43%;"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-close" onclick="closeModal()">✕</div>

            <div class="modal-header">
                <h2>Daily Reward</h2>
                <p>Connectez-vous chaque jour</p>
            </div>

            <div class="modal-days">
                <div class="modal-day claimed">
                    <div class="md-num">Day 1</div>
                    <div class="md-icon"></div>
                    <div class="md-reward">+1</div>
                </div>
                <div class="modal-day claimed">
                    <div class="md-num">Day 2</div>
                    <div class="md-icon"></div>
                    <div class="md-reward">+2</div>
                </div>
                <div class="modal-day unclaimed">
                    <div class="md-num">Day 3</div>
                    <div class="md-icon"></div>
                    <div class="md-reward">+3</div>
                </div>
                <div class="modal-day claimable">
                    <div class="md-num">Day 4</div>
                    <div class="md-icon">🪙</div>
                    <div class="md-reward">+4</div>
                </div>
                <div class="modal-day locked">
                    <div class="md-num">Day 5</div>
                    <div class="md-icon"></div>
                    <div class="md-reward">+5</div>
                </div>
                <div class="modal-day locked">
                    <div class="md-num">Day 6</div>
                    <div class="md-icon"></div>
                    <div class="md-reward">+5</div>
                </div>
            </div>

            <!-- Day 7 -->
            <div class="modal-day-7 locked">
                <div class="day7-left">
                    <div class="day7-icon">🎁</div>
                    <div class="day7-text">
                        <h3>Day 7 Jackpot</h3>
                        <p>Bonus spécial</p>
                    </div>
                </div>
                <div class="day7-reward">+20🎰</div>
            </div>

            <button class="modal-claim-btn" onclick="claimReward()">Claim</button>
        </div>
    </div>

    <!-- Popup -->
    <div class="reward-popup" id="popup">
        <span class="big-icon">🎰</span>
        <h3>Félicitations!</h3>
        <div class="reward-amount">+4 Free Spins</div>
    </div>

    <script>
        function openModal() {
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function claimReward() {
            closeModal();
            const popup = document.getElementById('popup');
            popup.classList.add('show');
            createConfetti();

            setTimeout(() => {
                document.querySelectorAll('.day-box.claimable, .modal-day.claimable').forEach(el => {
                    el.classList.remove('claimable');
                    el.classList.add('claimed');
                    const icon = el.querySelector('.day-icon, .md-icon');
                    if (icon) icon.textContent = '';
                });

                const next = document.querySelector('.day-box.locked');
                if (next) {
                    next.classList.remove('locked');
                    next.classList.add('claimable');
                    const icon = next.querySelector('.day-icon');
                    if (icon) icon.textContent = '🪙';
                }
            }, 400);

            setTimeout(() => popup.classList.remove('show'), 2500);
        }

        function createConfetti() {
            const colors = ['#E30613', '#FFD700', '#FFFFFF', '#00C853'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.className = 'confetti';
                    c.style.left = Math.random() * 100 + 'vw';
                    c.style.background = colors[Math.floor(Math.random() * colors.length)];
                    c.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 3000);
                }, i * 40);
            }
        }

        document.getElementById('modal').addEventListener('click', e => {
            if (e.target.id === 'modal') closeModal();
        });
    </script>
</body>
</html>
