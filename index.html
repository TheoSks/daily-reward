<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Welcome Offer - Custom DA</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0B1120;
    --bg-blue: #14223E;
    --card-bg: #2B3855;
    --red-gradient: linear-gradient(135deg, #FF5F6D 0%, #FFC371 100%); /* Fallback */
    --red-glossy: radial-gradient(circle at top left, #ef4444, #991b1b);
    --gold: #FFD700;
    --green: #22c55e;
    --stroke-width: 1.5px;
  }

  body {
    margin: 0;
    padding: 20px;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
  }

  /* --- CONTENEUR PRINCIPAL --- */
  .banner-container {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 100px; /* Hauteur ajustée pour bien voir les items */
    /* Fond Bleu Nuit avec dégradé subtil */
    background: radial-gradient(circle at 20% 50%, #1e3a8a 0%, #0f172a 100%);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    box-sizing: border-box;
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* Formes géométriques en arrière-plan (DA Space) */
  .bg-shape {
    position: absolute;
    background: rgba(255,255,255,0.03);
    z-index: 1;
    pointer-events: none;
  }
  .shape-1 { width: 100px; height: 100px; transform: rotate(45deg); top: -50px; left: 10%; }
  .shape-2 { width: 150px; height: 150px; transform: rotate(20deg); bottom: -80px; right: 20%; background: rgba(34, 211, 238, 0.05); }

  /* --- PARTIE GAUCHE : TITRE --- */
  .left-section {
    flex: 0 0 auto;
    z-index: 2;
    padding-right: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .title {
    font-family: 'Montserrat', sans-serif;
    font-style: italic;
    font-weight: 900;
    font-size: 26px; /* Ajusté pour mobile */
    line-height: 0.9;
    color: white;
    text-transform: capitalize; /* Ou uppercase selon pref */
    
    /* LE STYLE CONTOUR NOIR ÉPAIS (Stroke) */
    -webkit-text-stroke: 1.5px black;
    text-shadow: 3px 3px 0px #000000;
    transform: rotate(-2deg); /* Petite rotation dynamique */
  }
  .title span {
    display: block;
    font-size: 0.8em; /* "Offer" un peu plus petit si sur 2 lignes */
  }

  /* --- PARTIE DROITE : SCROLL --- */
  .scroll-container {
    flex: 1;
    height: 100%;
    z-index: 2;
    display: flex;
    align-items: center;
    overflow-x: auto;
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE */
    mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    padding-left: 10px;
  }
  .scroll-container::-webkit-scrollbar { display: none; }

  .items-track {
    display: flex;
    gap: 10px;
    padding-right: 10px;
    align-items: center;
  }

  /* --- ITEM GÉNÉRIQUE (CARRÉ ARRONDIS) --- */
  .item-card {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  /* --- STYLE 1 : RED REWARD (Cadeau x20) --- */
  .item-card.reward-red {
    background: var(--red-glossy);
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    flex-direction: column;
    /* Effet "Sunburst" simulé */
    background-image: repeating-conic-gradient(rgba(255,255,255,0.1) 0 15deg, transparent 15deg 30deg);
  }
