<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Casino - Day 1 Claim</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Palette */
    --bg-dark: #090e24;
    --green-light: #4ade80; --green-main: #22c55e; --green-shadow: #14532d;
    --gold-light: #fef08a; --gold-main: #fbbf24; --gold-shadow: #b45309;
    --grey-light: #d1d5db; --grey-main: #6b7280; --grey-shadow: #374151;
    --btn-blue-top: #3b82f6; --btn-blue-bot: #1d4ed8;
  }

  body {
    margin: 0;
    padding: 20px;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
  }

  /* --- LE CADRE PRINCIPAL --- */
  .banner {
    position: relative;
    width: 900px;
    height: 380px;
    background: radial-gradient(circle at 50% 40%, #172554 0%, #020617 90%);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.9);
    border: 1px solid #1e3a8a;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- TITRE --- */
  .title {
    margin-top: 25px;
    font-family: 'Titan One', cursive;
    font-size: 64px;
    text-transform: uppercase;
    color: white;
    z-index: 10;
    position: relative;
    background: linear-gradient(to bottom, #ffffff 45%, #bfdbfe 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 0px #b45309) drop-shadow(0 5px 5px rgba(0,0,0,0.8));
    -webkit-text-stroke: 1.5px #d97706;
  }

  /* --- GRID SYSTEM --- */
  .days-container {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
    margin-top: 20px;
    position: relative;
    z-index: 5;
    padding-bottom: 20px;
  }

  /* --- COLONNE JOUR --- */
  .day-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    width: 108px;
  }

  /* 1. BOITE RECOMPENSE */
  .reward-box {
    width: 100%;
    height: 100px;
    border-radius: 10px 10px 0 0;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 8px;
    box-shadow: inset 0 -10px 20px rgba(0,0,0,0.3);
    border: 2px solid rgba(255,255,255,0.3);
    border-bottom: none; 
  }

  /* Texte "20+" */
  .amount-tag {
    position: absolute;
    top: 8px;
    font-family: 'Titan One', cursive;
    font-size: 24px;
    color: #fde047;
    -webkit-text-stroke: 1px #854d0e;
    text-shadow: 0 2px 2px rgba(0,0,0,0.5);
    z-index: 5;
  }

  /* 2. LABEL JOUR */
  .day-label {
    width: 112%;
    height: 35px;
    margin-top: -1px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 800;
    font-size: 15px;
    color: white;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    clip-path: polygon(0% 0%, 90% 0%, 100% 50%, 90% 100%, 0% 100%, 10% 50%);
    padding-left: 8px;
    position: relative;
    z-index: 2;
  }

  /* --- STYLES PAR TYPE DE JOUR --- */

  /* TYPE: VERT (Completed) */
  .day-col.green .reward-box {
    background: linear-gradient(180deg, var(--green-light) 0%, var(--green-shadow) 100%);
    border-color: #86efac;
  }
  .day-col.green .day-label {
    background: linear-gradient(180deg, var(--green-main) 0%, var(--green-shadow) 100%);
    border-bottom: 2px solid #14532d; 
  }

  /* TYPE: OR (Active/Hero) */
  .day-col.gold {
    width: 135px; /* Plus large */
    z-index: 20; /* Au premier plan */
    margin: 0 4px;
  }
  .day-col.gold .reward-box {
    height: 125px; /* Plus haut */
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-shadow) 100%);
    border: 3px solid #fff;
    border-bottom: none;
    box-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
  }
  .day-col.gold .day-label {
    height: 40px;
    background: linear-gradient(180deg, var(--gold-main) 0%, var(--gold-shadow) 100%);
    font-size: 18px;
    clip-path: polygon(0% 0%, 92% 0%, 100% 50%, 92% 100%, 0% 100%, 8% 50%);
  }
  .day-col.gold .amount-tag {
    font-size: 28px;
    top: 12px;
  }
  
  /* TYPE: GRIS (Locked) */
  .day-col.grey .reward-box {
    background: linear-gradient(180deg, #9ca3af 0%, #374151 100%);
    border-color: #d1d5db;
  }
  .day-col.grey .day-label {
    background: linear-gradient(180deg, #6b7280 0%, #1f2937 100%);
    color: #e5e7eb;
  }
  .day-col.grey .amount-tag {
    color: #4b5563;
    -webkit-text-stroke: 0px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }

  /* --- EFFETS --- */
  .burst-light {
    position: absolute;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
    top: -20%; left: -50%;
    z-index: 0;
    opacity: 0.6;
    animation: pulseLight 2s infinite alternate;
  }
  @keyframes pulseLight { from { opacity: 0.4; transform: scale(0.9); } to { opacity: 0.7; transform: scale(1.1); } }

  .ready-text {
    position: absolute;
    bottom: -30px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    color: #fde047;
    font-size: 12px;
    text-transform: uppercase;
    text-shadow: 0 2px 2px black;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  /* --- IMAGES SVG --- */
  .gift-icon { width: 85px; height: 85px; z-index: 2; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)); }
  .lock-icon { width: 60px; height: 60px; z-index: 3; fill: #d1d5db; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.6)); }

  /* --- DECOR --- */
  .decor { position: absolute; pointer-events: none; }
  .planet-blue { bottom: -30px; left: -30px; width: 100px; opacity: 0.9; }
  .planet-saturn { top: -20px; right: -20px; width: 130px; opacity: 0.9; }
  .rocket-left { top: 70px; left: 30px; width: 50px; transform: rotate(45deg); }
  .rocket-right { top: 70px; right: 50px; width: 45px; transform: rotate(-45deg); }
  .stars {
    width: 100%; height: 100%; position: absolute;
    background-image: 
        radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px);
    background-size: 550px 550px, 350px 350px;
    background-position: 0 0, 40px 60px;
    opacity: 0.6;
  }

  /* --- BOUTON --- */
  .btn-claim {
    position: absolute;
    bottom: 30px;
    right: 40px;
    padding: 12px 30px;
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    border-radius: 12px;
    border: 2px solid #60a5fa;
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 20px;
    text-transform: uppercase;
    box-shadow: 0 4px 0 #1e3a8a, 0 5px 15px rgba(0,0,0,0.5);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    z-index: 50;
  }
</style>
</head>

    <symbol id="planet" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#3b82f6"/>
